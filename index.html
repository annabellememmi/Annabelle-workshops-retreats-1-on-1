  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .events { display: grid; gap: 22px; margin-top: 2.4em; }
    @media (min-width: 760px) { .events { grid-template-columns: repeat(2, 1fr); } }
    .event-card { display: block; border-radius: var(--radius); overflow: hidden; background: var(--cream); color: var(--ink); text-decoration: none; box-shadow: var(--shadow); text-align: start; transition: transform .2s ease; }
    .event-card:hover { transform: translateY(-4px); }
    .event-card img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .event-card div { padding: 20px 22px 24px; }
    .event-card h2 { font-size: 1.6rem; margin-bottom: .2em; }
    .event-card p { margin: 0; color: var(--ink-soft); }
    .event-card .eyebrow { letter-spacing: .08em; }
    .event-card .eyebrow::before { display: none; }
  </style>
</head>
<body>
  <section class="hero" style="min-height: 70svh;">
    <img class="hero__bg" src="assets/img/workshop-circle.jpg" alt="">
    <div class="hero__content">
      <span class="logo__mark" data-spiral="logo" style="display:block;margin:0 auto 1.2em;color:var(--cream)"></span>
      <p class="kicker">סדנאות · ריטריטים · ליווי אישי</p>

    </div>
  </section>
  <main class="section section--paper">
    <div class="wrap center">
      <p class="eyebrow">האירועים הקרובים</p>
      <!-- To add an event: copy a card below and point it at the new folder in events/ -->
      <div class="events">
        <a class="event-card" href="events/reconnect-nov-2026/">
          <img src="assets/img/og-reconnect.jpg" alt="" loading="lazy">
          <div>
            <p class="eyebrow">יום חמישי · 12 בנובמבר · תלמי אלעזר</p>
            <h2>מתחברת חזרה לעצמך בכיף</h2>
            <p>ערב סדנאות העצמה וריקודים לנשים</p>
          </div>
        </a>
      </div>
    </div>
  </main>
  <footer class="footer" style="padding-bottom: 48px;">
    <p>📞 <a href="https://wa.me/972525826993">052-5826993</a> · <a href="https://www.instagram.com/anabellos5">אינסטגרם</a></p>
  </footer>
  <script src="assets/js/spiral.js"></script>
</body>
